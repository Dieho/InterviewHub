syntax = "proto3";

option csharp_namespace = "InterviewHub.Api.Grpc";

package progress;

service ProgressService {
  rpc GetQuestionCount (CountRequest) returns (CountResponse);
  rpc WatchNewQuestions (WatchRequest) returns (stream QuestionNotification);
}

message CountRequest {}

message CountResponse {
  int32 total = 1;
}

message WatchRequest {}

message QuestionNotification {
  string id = 1;
  string text = 2;
  string category_name = 3;
}