apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: interviewhub-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Default
              value: "Host=postgres-service;Port=5432;Database=interviewhub;Username=postgres;Password=devpass"
            - name: Jwt__Issuer
              value: "InterviewHub"
            - name: Jwt__Audience
              value: "InterviewHubClients"
            - name: Jwt__Key
              value: "asdfghjklqwertyuiopzxcvbnm1234567890"
            - name: Jwt__ExpiryMinutes
              value: "60"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080