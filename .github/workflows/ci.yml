name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore InterviewHub.sln

      - name: Build
        run: dotnet build InterviewHub.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test InterviewHub.sln --no-build --configuration Release --logger "console;verbosity=normal"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test  # запускається ТІЛЬКИ якщо build-and-test пройшов успішно

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Api/Dockerfile
          push: false
          tags: interviewhub-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./interview-hub-web
          file: ./interview-hub-web/Dockerfile
          push: false
          tags: interviewhub-web:ci