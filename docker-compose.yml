services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: interviewhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    ports:
      - "5118:8080"
      - "5119:8081"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=interviewhub;Username=postgres;Password=devpass"
      Jwt__Issuer: "InterviewHub"
      Jwt__Audience: "InterviewHubClients"
      Jwt__Key: "asdfghjklqwertyuiopzxcvbnm1234567890"
      Jwt__ExpiryMinutes: "60"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./interview-hub-web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata: